apiVersion: v1
kind: Namespace
metadata:
  name: base42-cms
---
# apiVersion: v1
# kind: PersistentVolumeClaim
# metadata:
#   name: postgres-data
#   namespace: base42-cms
# spec:
#   accessModes:
#     - ReadWriteOnce
#   resources:
