apiVersion: v1
kind: Namespace
metadata:
  name: base42-web
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: base42-web
  namespace: base42-web
  labels:
    app: base42-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: base42-web
  template:
    metadata:
      labels:
        app: base42-web
    spec:
      containers:
        - name: base42-web
          image: ghcr.io/42dotmk/42dotmk-frontend:latest
          env:
            - name: STRAPI_URL
              value: "https://cms.42.mk/api/"
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: base42-web
  namespace: base42-web
  labels:
    app: base42-web
spec:
  selector:
    app: base42-web
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: base42-web
  namespace: base42-web
  labels:
    app: base42-web
spec:
  ingressClassName: traefik
  rules:
    - host: kube.42.mk
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: base42-web
                port:
                  number: 8080
