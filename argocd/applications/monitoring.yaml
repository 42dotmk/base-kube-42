apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 72.6.2
    helm:
      values: |
        grafana:
          persistence:
            enabled: false
          adminPassword: base42admin
          ingress:
            enabled: true
            ingressClassName: traefik
            hosts:
              - grafana.kube.42.mk
        prometheus:
          prometheusSpec:
            retention: 7d
            storageSpec: {}
        alertmanager:
          enabled: true
          alertmanagerSpec:
            storage: {}
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: privileged
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
